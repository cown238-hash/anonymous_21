<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="12%" stop-color="#ecf1f6"/>
      <stop offset="26%" stop-color="#96a1af"/>
      <stop offset="42%" stop-color="#f8fbfd"/>
      <stop offset="56%" stop-color="#808c9a"/>
      <stop offset="72%" stop-color="#ced6de"/>
      <stop offset="88%" stop-color="#606b78"/>
      <stop offset="100%" stop-color="#3a424c"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="42%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0b0f14" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#606a76"/>
      <stop offset="100%" stop-color="#1a1f25"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.72" cy="0.18" r="0.95">
      <stop offset="0%" stop-color="#2b3a4a"/>
      <stop offset="55%" stop-color="#101820"/>
      <stop offset="100%" stop-color="#05070a"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="60">
    <!-- Cast shadow on the backdrop -->
    <path d="M128 144 L208 368 L256 240 L304 368 L384 144"
          transform="translate(-26 34) scale(1.1)" stroke="#000000" stroke-opacity="0.55"/>
    <!-- Extrusion, stepped back to front -->
    <path d="M128 144 L208 368 L256 240 L304 368 L384 144" transform="translate(17 80)" stroke="url(#side)"/>
    <path d="M128 144 L208 368 L256 240 L304 368 L384 144" transform="translate(14 64)" stroke="url(#side)"/>
    <path d="M128 144 L208 368 L256 240 L304 368 L384 144" transform="translate(10 48)" stroke="url(#side)"/>
    <path d="M128 144 L208 368 L256 240 L304 368 L384 144" transform="translate(7 32)" stroke="url(#side)"/>
    <path d="M128 144 L208 368 L256 240 L304 368 L384 144" transform="translate(3 16)" stroke="url(#side)"/>
    <!-- Lit front face -->
    <g transform="translate(0 -10)">
      <path d="M128 144 L208 368 L256 240 L304 368 L384 144" stroke="url(#body)"/>
      <path d="M128 144 L208 368 L256 240 L304 368 L384 144" stroke="url(#bevel)"/>
    </g>
  </g>
</svg>
