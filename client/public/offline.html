<!doctype html>
<html lang="th" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ออฟไลน์ · WKSL</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #080c18;
        color: #eef1fa;
        font-family: 'IBM Plex Sans Thai', ui-sans-serif, system-ui, -apple-system, 'Segoe UI',
          'Noto Sans Thai', sans-serif;
      }
      .card {
        max-width: 30rem;
        text-align: center;
        background: #0f1526;
        border: 1px solid rgba(141, 149, 174, 0.15);
        border-radius: 1.25rem;
        padding: 2.5rem 2rem;
      }
      .icon {
        width: 3.5rem; height: 3.5rem; margin: 0 auto 1.5rem;
        border-radius: 1rem;
        background: linear-gradient(135deg, #6366f1, #22d3ee);
        display: grid; place-items: center; font-size: 1.6rem;
      }
      h1 { margin: 0 0 0.75rem; font-size: 1.35rem; }
      p { margin: 0 0 1.5rem; color: #8d95ae; font-size: 0.95rem; line-height: 1.7; }
      button {
        cursor: pointer;
        border: 0;
        border-radius: 0.75rem;
        padding: 0.7rem 1.4rem;
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: #4f46e5;
      }
      button:hover { background: #6366f1; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">📡</div>
      <h1>ขาดการเชื่อมต่ออินเทอร์เน็ต</h1>
      <p>
        ขณะนี้ออฟไลน์อยู่ ข้อมูลที่แสดงอาจไม่ใช่ข้อมูลล่าสุด
        และการส่งข้อความหรือบทความใหม่จะยังทำงานไม่ได้
      </p>
      <button type="button" onclick="location.reload()">ลองอีกครั้ง</button>
    </div>
    <script>
      addEventListener('online', () => location.reload());
    </script>
  </body>
</html>
