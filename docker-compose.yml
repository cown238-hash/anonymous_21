name: nimbus

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nimbus}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - '${DB_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nimbus}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-nimbus}?schema=public
      # Replace every secret before deploying anywhere real.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      # Encrypt the TOTP shared secret at rest.
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4000}
      CLIENT_ORIGINS: ${CLIENT_ORIGINS:-http://localhost:4000}
      TRUST_PROXY: 'true'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # SMTP is optional; without it emails are logged instead of sent.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-WKSL <no-reply@nimbus.local>}
      ENABLE_JOBS: ${ENABLE_JOBS:-true}
      JOB_INTERVAL_MINUTES: ${JOB_INTERVAL_MINUTES:-30}
    ports:
      - '${APP_PORT:-4000}:4000'
    volumes:
      - uploads-data:/app/server/uploads

  # Example of a one-shot maintenance run:
  #   docker compose run --rm jobs
  jobs:
    profiles: ['tools']
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-nimbus}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    command: ['node', 'server/dist/services/jobs.js']

volumes:
  db-data:
  uploads-data:
